[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "booking-precheck-single-agent"
version = "0.1.0"
description = "Day 1 single-agent booking precheck workshop sample with deterministic rule baseline"
requires-python = ">=3.11,<3.15"
dependencies = [
  "booking-precheck-contracts",
  "jsonschema>=4.25,<5",
  "langchain-openai>=1,<2",
  "langgraph>=1.2.10,<2",
  "openai>=2,<3",
  "pdfplumber>=0.11,<1",
  "pydantic>=2.12,<3",
]

[tool.uv.sources]
booking-precheck-contracts = { workspace = true }

[project.optional-dependencies]
dev = [
  "langgraph-cli[inmem]>=0.4,<1",
  "pytest>=8,<10",
]

[project.scripts]
booking-precheck = "booking_precheck.cli:main"
booking-precheck-eval-adapter = "booking_precheck.evaluation_adapter:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
