[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "booking-precheck-contracts"
version = "0.1.0"
description = "Versioned black-box evaluation protocol for Booking Precheck agents"
requires-python = ">=3.11,<3.15"
dependencies = ["pydantic>=2.12,<3"]

[tool.setuptools.packages.find]
where = ["src"]
