[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "booking-precheck-eval"
version = "0.1.0"
description = "Architecture-neutral evaluation harness for the Booking Precheck workshop"
requires-python = ">=3.11,<3.15"
dependencies = ["booking-precheck-contracts"]

[tool.uv.sources]
booking-precheck-contracts = { workspace = true }

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
langfuse = ["langfuse>=4.10,<5"]

[project.scripts]
booking-precheck-eval = "booking_precheck_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
